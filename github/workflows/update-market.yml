name: Refresh authorized market data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-refresh
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch quotes (licensed feed only)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/update_market_quotes.py
      - name: Commit new valid quotes
        run: |
          if ! git diff --quiet -- market-quotes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add market-quotes.json
            git commit -m 'Update authorized market quotes'
            git push
          fi
