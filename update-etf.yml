name: 更新臺灣 ETF 官方名錄
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1-5'
permissions:
  contents: write
jobs:
  update-etf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing libraries
        run: python -m pip install requests beautifulsoup4 pandas lxml
      - name: Download and validate official ETF catalog
        run: python scripts/update_etf_catalog.py
      - name: Commit new catalog if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etf-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official TWSE ETF catalog'
            git push
          fi
